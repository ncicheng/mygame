# Render Blueprint — MyGame backend + Postgres
# 用 Render 的 "New Blueprint Instance" 从本仓库拉取创建。
# Monorepo：从仓库根构建（npm workspaces 解析 @mygame/shared），启动 backend/dist/index.js。

databases:
  - name: mygame-db
    databaseName: mygame
    user: mygame
    plan: free
    ipAllowList: []

services:
  - type: web
    name: mygame-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mygame-db
          property: connectionString
      - key: PORT
        value: 10000
